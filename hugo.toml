baseURL = "https://analytics-ds.github.io/nutri-atlas-report/"
locale = "de"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
title = "Nutri Atlas Report"
theme = "nutri-atlas-theme"
paginate = 12
removePathAccents = true

[languages]
  [languages.de]
    locale = "de-DE"
    label = "Deutsch"
    weight = 1
    title = "Nutri Atlas Report"
    contentDir = "content/de"
    [languages.de.params]
      description = "Nutri Atlas Report ist ein wissenschaftlich fundiertes Wellness-Journal ueber Schoenheit, Gewicht, Schlaf und Immunsystem fuer Frauen."
      hero_badge = "Wellness, wissenschaftlich fundiert"
      hero_title = "NUTRI ATLAS REPORT"
      hero_description = "Ihr Wellness-Journal fuer Schoenheit, Gewicht, Schlaf und Immunsystem, fundiert und ehrlich, ohne leere Versprechen."

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    title = "Nutri Atlas Report"
    contentDir = "content/en"
    [languages.en.params]
      description = "Nutri Atlas Report is a science-backed wellness journal covering beauty, weight, sleep and immunity for women."
      hero_badge = "Science-backed wellness"
      hero_title = "NUTRI ATLAS REPORT"
      hero_description = "Your wellness journal for beauty, weight, sleep and immunity, backed by science, no empty promises."

  [languages.fr]
    locale = "fr-FR"
    label = "Francais"
    weight = 3
    title = "Nutri Atlas Report"
    contentDir = "content/fr"
    [languages.fr.params]
      description = "Nutri Atlas Report est un journal bien-etre fonde sur la science, consacre a la beaute, au poids, au sommeil et a l'immunite des femmes."
      hero_badge = "Le bien-etre valide par la science"
      hero_title = "NUTRI ATLAS REPORT"
      hero_description = "Votre journal bien-etre dedie a la beaute, au poids, au sommeil et a l'immunite, sans promesses en l'air."

  [languages.it]
    locale = "it-IT"
    label = "Italiano"
    weight = 4
    title = "Nutri Atlas Report"
    contentDir = "content/it"
    [languages.it.params]
      description = "Nutri Atlas Report e un giornale di benessere basato sulla scienza dedicato a bellezza, peso, sonno e immunita delle donne."
      hero_badge = "Benessere validato dalla scienza"
      hero_title = "NUTRI ATLAS REPORT"
      hero_description = "Il tuo giornale di benessere dedicato a bellezza, peso, sonno e immunita, senza promesse vuote."

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']

