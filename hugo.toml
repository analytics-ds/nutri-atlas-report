[params]
  description = "Nutri Atlas Report ist ein wissenschaftlich fundiertes Wellness-Journal ueber Schoenheit, Gewicht, Schlaf und Immunsystem fuer Frauen."
  author_name = "Die Redaktion"
  author_url = "https://analytics-ds.github.io/nutri-atlas-report/"
  author_job_title = "Redaktionsteam"
  author_bio = "Das Redaktionsteam von Nutri Atlas Report vereint Wellness- und Ernaehrungsexpertise. Jeder Artikel stuetzt sich auf verlaessliche wissenschaftliche Quellen und respektiert die YMYL-Standards fuer Gesundheitsinhalte."
  logo = "/favicon.svg"
  default_og_image = "/images/og-default.jpg"
  founding_year = "2026"
  expertise = ["Wellness", "Ernaehrung", "Frauengesundheit"]

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true
